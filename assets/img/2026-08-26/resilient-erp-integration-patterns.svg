<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Resilient ERP integration architecture: gentle polling, token-bucket rate limiting, circuit breaker, and multi-schema PostgreSQL isolation">
  <style>
    text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .title{font-size:22px;font-weight:700;fill:#1f2933}
    .sub{font-size:13px;fill:#52606d}
    .ph{font-size:14px;font-weight:700}
    .badge{font-size:10px;font-weight:700;letter-spacing:.6px}
    .row{font-size:11.5px;fill:#1f2933}
    .hub{font-size:12px;font-weight:700;fill:#ffffff}
    .hubs{font-size:10px;fill:#d2e3fc}
    .trap-title{font-size:11px;font-weight:700;fill:#b03a2e}
    .trap-desc{font-size:10px;fill:#52606d}
  </style>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="38" class="title">Resilient ERP Integration &amp; Multi-Schema Architecture</text>
  <text x="30" y="60" class="sub">Taming legacy XML-RPC worker starvation with gentle polling, circuit breakers, and database schema isolation.</text>

  <defs>
    <marker id="m-blue4" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1c7ed6"/></marker>
    <marker id="m-green4" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2f9e44"/></marker>
    <marker id="m-red4" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e03131"/></marker>
  </defs>

  <!-- 3 MAIN BLOCKS -->
  <!-- 1. Microservice Consumers -->
  <rect x="24" y="80" width="220" height="230" rx="10" fill="#e7f1fb" stroke="#9ec5f0" stroke-width="1.5"/>
  <text x="38" y="106" class="ph" fill="#1c5fa8">Edge Microservices</text>
  <rect x="156" y="92" width="76" height="20" rx="10" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="194" y="106" text-anchor="middle" class="badge" fill="#1c7ed6">CONSUMERS</text>

  <rect x="36" y="122" width="196" height="34" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="46" y="144" class="row" font-weight="bold">WMS Inventory Sync</text>
  <rect x="36" y="162" width="196" height="34" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="46" y="184" class="row" font-weight="bold">MRP Production Planner</text>
  <rect x="36" y="202" width="196" height="34" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="46" y="224" class="row" font-weight="bold">AP Invoice Matcher</text>
  <rect x="36" y="242" width="196" height="34" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="46" y="264" class="row" font-weight="bold">MES Work Order Watcher</text>
  <text x="38" y="298" class="row" font-size="10.5px" fill="#1c5fa8">Concurrent requests &gt; 50 req/sec</text>

  <!-- Arrow 1 to 2 -->
  <line x1="244" y1="195" x2="276" y2="195" stroke="#1c7ed6" stroke-width="2" marker-end="url(#m-blue4)"/>

  <!-- 2. The Resilient ERP Gateway (The Buffer) -->
  <rect x="280" y="80" width="340" height="230" rx="10" fill="#1864ab" stroke="#15aabf" stroke-width="1.5"/>
  <text x="296" y="106" class="ph" fill="#ffffff">Shared ERP Gate &amp; Circuit Breaker</text>
  <rect x="532" y="92" width="76" height="20" rx="10" fill="#e7f5ff" stroke="#339af0"/>
  <text x="570" y="106" text-anchor="middle" class="badge" fill="#1864ab">RESILIENCY</text>

  <rect x="294" y="122" width="312" height="38" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="304" y="140" class="hub">Token-Bucket Rate Limiter</text>
  <text x="304" y="152" class="hubs">Capped at 5 req/sec &#8212; eliminates burst starvation</text>

  <rect x="294" y="166" width="312" height="38" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="304" y="184" class="hub">Jittered Exponential Backoff</text>
  <text x="304" y="196" class="hubs">T_wait = min(T_max, T_base &#215; 2^retry) + random_jitter</text>

  <rect x="294" y="210" width="312" height="38" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="304" y="228" class="hub">Fast-Fail Circuit Breaker</text>
  <text x="304" y="240" class="hubs">Opens after 3 consecutive timeouts &#8212; serves cache</text>

  <rect x="294" y="254" width="312" height="44" rx="5" fill="#2f9e44" stroke="#8ce99a"/>
  <text x="450" y="272" text-anchor="middle" class="hub">Multi-Schema Postgres Isolation</text>
  <text x="450" y="286" text-anchor="middle" class="hubs">Schemas: [wms] [mrp] [rfq] [crm] [sync]</text>

  <!-- Arrow 2 to 3 -->
  <line x1="620" y1="195" x2="652" y2="195" stroke="#2f9e44" stroke-width="2" marker-end="url(#m-green4)"/>

  <!-- 3. Legacy ERP Core -->
  <rect x="656" y="80" width="220" height="230" rx="10" fill="#e6f4ea" stroke="#9ed6ad" stroke-width="1.5"/>
  <text x="670" y="106" class="ph" fill="#1c7a3f">Legacy ERP Core</text>
  <rect x="792" y="92" width="72" height="20" rx="10" fill="#ffffff" stroke="#2b8a3e"/>
  <text x="828" y="106" text-anchor="middle" class="badge" fill="#2b8a3e">LEGACY</text>

  <rect x="668" y="122" width="196" height="34" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="678" y="144" class="row" font-weight="bold">Single-Threaded XML-RPC</text>
  <rect x="668" y="162" width="196" height="34" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="678" y="184" class="row" font-weight="bold">Heavy ORM Relational Joins</text>
  <rect x="668" y="202" width="196" height="34" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="678" y="224" class="row" font-weight="bold">Long-lived DB Locks</text>
  <rect x="668" y="242" width="196" height="34" rx="5" fill="#d3f9d8" stroke="#69db7c"/>
  <text x="678" y="264" class="row" font-weight="bold" fill="#2b8a3e">Smooth, Gentle Polling Load</text>
  <text x="670" y="298" class="row" font-size="10.5px" fill="#1c7a3f">Zero connection refused errors</text>

  <!-- BOTTOM PANEL: The 3 Core Anti-Patterns -->
  <rect x="24" y="322" width="852" height="132" rx="10" fill="#fdecea" stroke="#e8a79c" stroke-width="1.2"/>
  <text x="40" y="342" class="ph" fill="#b03a2e">ERP Integration Traps &amp; Solutions</text>

  <rect x="38" y="352" width="262" height="90" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="50" y="370" class="trap-title">1. The Synchronous Burst Trap</text>
  <text x="50" y="388" class="trap-desc">5 microservices cron at 00:00 UTC.</text>
  <text x="50" y="402" class="trap-desc">ERP worker pool exhausts &rarr; ECONNREFUSED.</text>
  <text x="50" y="424" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Single-gate multiplexer with jitter</text>

  <rect x="318" y="352" width="264" height="90" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="330" y="370" class="trap-title">2. Direct ERP Database Writes</text>
  <text x="330" y="388" class="trap-desc">Writing directly to ERP SQL bypasses</text>
  <text x="330" y="402" class="trap-desc">ORM computed fields &amp; journal entries.</text>
  <text x="330" y="424" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Read via SQL, write via XML-RPC only</text>

  <rect x="600" y="352" width="264" height="90" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="612" y="370" class="trap-title">3. Cross-Schema Table Locks</text>
  <text x="612" y="388" class="trap-desc">Foreign keys spanning service schemas</text>
  <text x="612" y="402" class="trap-desc">deadlock during Alembic migrations.</text>
  <text x="612" y="424" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Logical IDs &amp; decoupled migrations</text>
</svg>
