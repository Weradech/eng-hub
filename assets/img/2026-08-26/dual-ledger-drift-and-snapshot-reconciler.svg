<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Dual-ledger reconciliation: aligning operational movements with financial valuation through snapshot-driven delta detection and ghost receipt prevention">
  <style>
    text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .title{font-size:22px;font-weight:700;fill:#1f2933}
    .sub{font-size:13px;fill:#52606d}
    .ph{font-size:14px;font-weight:700}
    .badge{font-size:10.5px;font-weight:700;letter-spacing:.6px}
    .row{font-size:11.5px;fill:#1f2933}
    .hub{font-size:12px;font-weight:700;fill:#ffffff}
    .hubs{font-size:10px;fill:#d2e3fc}
    .trap-title{font-size:11px;font-weight:700;fill:#b03a2e}
    .trap-desc{font-size:10px;fill:#52606d}
    .foot{font-size:12px;fill:#3e4c59}
  </style>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="38" class="title">Dual-Ledger Reconciliation &amp; Drift Elimination</text>
  <text x="30" y="60" class="sub">Reconciling operational item movements with financial ERP valuation using periodic snapshots and 3-way delta tracking.</text>

  <defs>
    <marker id="m-blue" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1c7ed6"/></marker>
    <marker id="m-green" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2f9e44"/></marker>
    <marker id="m-red" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e03131"/></marker>
  </defs>

  <!-- LEFT PANEL: Operational WMS Ledger -->
  <rect x="24" y="80" width="256" height="220" rx="10" fill="#e7f1fb" stroke="#9ec5f0" stroke-width="1.5"/>
  <text x="40" y="106" class="ph" fill="#1c5fa8">Operational Ledger (WMS)</text>
  <rect x="176" y="92" width="92" height="20" rx="10" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="222" y="106" text-anchor="middle" class="badge" fill="#1c7ed6">PHYSICAL</text>
  <text x="40" y="126" class="sub" fill="#1c5fa8">Immediate physical stock events</text>

  <rect x="38" y="138" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="48" y="155" class="row">Item Movement Ledger (Append-only)</text>
  <rect x="38" y="170" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="48" y="187" class="row">IQC Inspection &amp; Direct Putaway</text>
  <rect x="38" y="202" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="48" y="219" class="row">Real-time Subcon &amp; Internal Transfers</text>
  <rect x="38" y="234" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="48" y="251" class="row">Location-aware Bin Tracking</text>
  <rect x="38" y="266" width="228" height="24" rx="5" fill="#d0ebff" stroke="#74c0fc"/>
  <text x="48" y="282" class="row" font-weight="bold" fill="#1864ab">Current On-Hand Qty: Q_wms</text>

  <!-- CENTER PANEL: Reconciler Engine -->
  <rect x="316" y="80" width="268" height="220" rx="10" fill="#1864ab" stroke="#15aabf" stroke-width="1.5"/>
  <text x="336" y="106" class="ph" fill="#ffffff">3-Way Reconcile Engine</text>
  <rect x="496" y="92" width="76" height="20" rx="10" fill="#e7f5ff" stroke="#339af0"/>
  <text x="534" y="106" text-anchor="middle" class="badge" fill="#1864ab">ANALYZER</text>
  <text x="336" y="126" class="hubs">Snapshot matching &amp; anomaly detector</text>

  <rect x="332" y="138" width="236" height="34" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="342" y="154" class="hub">03:00 UTC Scheduled Quant Snapshot</text>
  <text x="342" y="166" class="hubs">Immutable capture of ERP layer states</text>

  <rect x="332" y="178" width="236" height="34" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="342" y="194" class="hub">3-Way Delta Math Engine</text>
  <text x="342" y="206" class="hubs">Delta = Q_phys - Q_ledger - Q_quant</text>

  <rect x="332" y="218" width="236" height="34" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="342" y="234" class="hub">SAVEPOINT Isolation &amp; Watchdog</text>
  <text x="342" y="246" class="hubs">Atomic chunking prevents total run rollback</text>

  <rect x="332" y="258" width="236" height="32" rx="5" fill="#2f9e44" stroke="#8ce99a"/>
  <text x="450" y="279" text-anchor="middle" class="hub">Clean Reconciliation Report (0 Drift)</text>

  <!-- RIGHT PANEL: Financial ERP Ledger -->
  <rect x="620" y="80" width="256" height="220" rx="10" fill="#e6f4ea" stroke="#9ed6ad" stroke-width="1.5"/>
  <text x="636" y="106" class="ph" fill="#1c7a3f">Financial Ledger (ERP)</text>
  <rect x="776" y="92" width="88" height="20" rx="10" fill="#ffffff" stroke="#2b8a3e"/>
  <text x="820" y="106" text-anchor="middle" class="badge" fill="#2b8a3e">VALUATION</text>
  <text x="636" y="126" class="sub" fill="#1c7a3f">Official accounting books &amp; valuation</text>

  <rect x="634" y="138" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="644" y="155" class="row">Purchase Orders &amp; Vendor Bills</text>
  <rect x="634" y="170" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="644" y="187" class="row">Stock Picking States (Assigned/Done)</text>
  <rect x="634" y="202" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="644" y="219" class="row">Moving Average Costing (MAC)</text>
  <rect x="634" y="234" width="228" height="26" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="644" y="251" class="row">Journal Entries &amp; Balance Sheets</text>
  <rect x="634" y="266" width="228" height="24" rx="5" fill="#d3f9d8" stroke="#69db7c"/>
  <text x="644" y="282" class="row" font-weight="bold" fill="#2b8a3e">Valuation Basis: Q_erp &#215; UnitCost</text>

  <!-- CONNECTING ARROWS -->
  <line x1="280" y1="190" x2="310" y2="190" stroke="#1c7ed6" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="620" y1="190" x2="590" y2="190" stroke="#2f9e44" stroke-width="2" marker-end="url(#m-green)"/>

  <!-- BOTTOM PANEL: The 3 Systemic Drift Traps -->
  <rect x="24" y="312" width="852" height="142" rx="10" fill="#fdecea" stroke="#e8a79c" stroke-width="1.2"/>
  <text x="40" y="332" class="ph" fill="#b03a2e">The 3 Systemic Drift Traps Eliminated by Snapshot Reconciler</text>

  <!-- Trap 1 -->
  <rect x="38" y="342" width="262" height="100" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="50" y="360" class="trap-title">1. Picking State Lag</text>
  <text x="50" y="378" class="trap-desc">Goods physically received in WMS but</text>
  <text x="50" y="392" class="trap-desc">ERP picking stuck in 'assigned' state.</text>
  <text x="50" y="410" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Status-aware delta classification</text>
  <text x="50" y="426" class="trap-desc" fill="#868e96">Prevents false alarms during active dock receiving.</text>

  <!-- Trap 2 -->
  <rect x="318" y="342" width="264" height="100" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="330" y="360" class="trap-title">2. Cancel &amp; Backdated Reissue</text>
  <text x="330" y="378" class="trap-desc">Buyer cancels PO and reissues with backdate.</text>
  <text x="330" y="392" class="trap-desc">Original receipt becomes a 'ghost' in WMS ledger.</text>
  <text x="330" y="410" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Doc-state audit job &amp; provenance map</text>
  <text x="330" y="426" class="trap-desc" fill="#868e96">Purges orphaned references safely.</text>

  <!-- Trap 3 -->
  <rect x="600" y="342" width="264" height="100" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="612" y="360" class="trap-title">3. Unledgered Write Paths</text>
  <text x="612" y="378" class="trap-desc">Direct updates to on-hand tables bypassing</text>
  <text x="612" y="392" class="trap-desc">the append-only movement history.</text>
  <text x="612" y="410" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: DB Triggers &amp; strict ORM invariants</text>
  <text x="612" y="426" class="trap-desc" fill="#868e96">Every balance mutation requires a movement row.</text>
</svg>
