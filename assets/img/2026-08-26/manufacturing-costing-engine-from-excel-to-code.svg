<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Deterministic manufacturing costing engine: translating complex spreadsheet models into precise TypeScript and Python calculation engines">
  <style>
    text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .title{font-size:22px;font-weight:700;fill:#1f2933}
    .sub{font-size:13px;fill:#52606d}
    .ph{font-size:14px;font-weight:700}
    .badge{font-size:10px;font-weight:700;letter-spacing:.6px}
    .row{font-size:11.5px;fill:#1f2933}
    .hub{font-size:12px;font-weight:700;fill:#ffffff}
    .hubs{font-size:10px;fill:#d2e3fc}
    .trap-title{font-size:11px;font-weight:700;fill:#b03a2e}
    .trap-desc{font-size:10px;fill:#52606d}
  </style>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="38" class="title">Deterministic Manufacturing Costing &amp; RFQ Engine</text>
  <text x="30" y="60" class="sub">Translating intricate spreadsheet geometry, compounding overheads, and margin gates into code.</text>

  <defs>
    <marker id="m-blue3" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1c7ed6"/></marker>
    <marker id="m-green3" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2f9e44"/></marker>
  </defs>

  <!-- 3 COLUMNS -->
  <!-- Col 1: Packaging & Physical Geometry -->
  <rect x="24" y="80" width="268" height="230" rx="10" fill="#e7f1fb" stroke="#9ec5f0" stroke-width="1.5"/>
  <text x="40" y="106" class="ph" fill="#1c5fa8">1. Physical &amp; Packaging Geometry</text>
  <rect x="206" y="92" width="74" height="20" rx="10" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="243" y="106" text-anchor="middle" class="badge" fill="#1c7ed6">GEOMETRY</text>
  
  <rect x="38" y="122" width="240" height="42" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="48" y="140" class="row" font-weight="bold">PCB Clearance Rules</text>
  <text x="48" y="154" class="row" font-size="10.5px" fill="#52606d">X/Y Axis: +2.0% &#183; Z Axis (Height): +20.0%</text>

  <rect x="38" y="170" width="240" height="42" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="48" y="188" class="row" font-weight="bold">Master Carton Grid Capacity</text>
  <text x="48" y="202" class="row" font-size="10.5px" fill="#52606d">N = floor(Box_L/L_eff) &#215; floor(Box_W/W_eff) &#215; ...</text>

  <rect x="38" y="218" width="240" height="42" rx="5" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="48" y="236" class="row" font-weight="bold">AQL 0.65 Normal Sampling</text>
  <text x="48" y="250" class="row" font-size="10.5px" fill="#52606d">Batch size mapped to inspection sample size</text>

  <rect x="38" y="266" width="240" height="32" rx="5" fill="#d0ebff" stroke="#74c0fc"/>
  <text x="48" y="286" class="row" font-weight="bold" fill="#1864ab">Packaging &amp; QA Cost per Unit</text>

  <!-- Arrow 1 to 2 -->
  <line x1="292" y1="195" x2="314" y2="195" stroke="#1c7ed6" stroke-width="2" marker-end="url(#m-blue3)"/>

  <!-- Col 2: Compounding Overhead & Labor -->
  <rect x="318" y="80" width="264" height="230" rx="10" fill="#1864ab" stroke="#15aabf" stroke-width="1.5"/>
  <text x="334" y="106" class="ph" fill="#ffffff">2. Labor &amp; Compounding Rates</text>
  <rect x="494" y="92" width="76" height="20" rx="10" fill="#e7f5ff" stroke="#339af0"/>
  <text x="532" y="106" text-anchor="middle" class="badge" fill="#1864ab">CALCULATOR</text>

  <rect x="332" y="122" width="236" height="42" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="342" y="140" class="hub">Process Cycle Time &amp; Headcount</text>
  <text x="342" y="154" class="hubs">Labor = (CycleMinutes / 60) &#215; HourlyRate &#215; HC</text>

  <rect x="332" y="170" width="236" height="42" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="342" y="188" class="hub">Material Overhead (MOH) Stacking</text>
  <text x="342" y="202" class="hubs">Raw Material Cost &#215; (1 + MOH_Local + MOH_Import)</text>

  <rect x="332" y="218" width="236" height="42" rx="5" fill="#1c7ed6" stroke="#4dabf7"/>
  <text x="342" y="236" class="hub">NRE &amp; Tooling Amortization</text>
  <text x="342" y="250" class="hubs">Stencil + JIG + Fixture divided by PO Volume</text>

  <rect x="332" y="266" width="236" height="32" rx="5" fill="#2f9e44" stroke="#8ce99a"/>
  <text x="450" y="286" text-anchor="middle" class="hub">Total Manufactured Cost (COGS)</text>

  <!-- Arrow 2 to 3 -->
  <line x1="582" y1="195" x2="604" y2="195" stroke="#2f9e44" stroke-width="2" marker-end="url(#m-green3)"/>

  <!-- Col 3: Gross-up Pricing & Gate -->
  <rect x="608" y="80" width="268" height="230" rx="10" fill="#e6f4ea" stroke="#9ed6ad" stroke-width="1.5"/>
  <text x="624" y="106" class="ph" fill="#1c7a3f">3. Gross-up Pricing &amp; Gates</text>
  <rect x="792" y="92" width="72" height="20" rx="10" fill="#ffffff" stroke="#2b8a3e"/>
  <text x="828" y="106" text-anchor="middle" class="badge" fill="#2b8a3e">MARGIN GATE</text>

  <rect x="622" y="122" width="240" height="42" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="632" y="140" class="row" font-weight="bold">Gross-up Selling Price</text>
  <text x="632" y="154" class="row" font-size="10.5px" fill="#2b8a3e">P = DirectCost / (1 - TargetMargin%)</text>

  <rect x="622" y="170" width="240" height="42" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="632" y="188" class="row" font-weight="bold">Commission &amp; Contribution Gate</text>
  <text x="632" y="202" class="row" font-size="10.5px" fill="#2b8a3e">CM% = (Revenue - VariableCost) / Revenue</text>

  <rect x="622" y="218" width="240" height="42" rx="5" fill="#ffffff" stroke="#9ed6ad"/>
  <text x="632" y="236" class="row" font-weight="bold">Dual-Language Parity</text>
  <text x="632" y="250" class="row" font-size="10.5px" fill="#2b8a3e">TypeScript (UI) == Python (Backend)</text>

  <rect x="622" y="266" width="240" height="32" rx="5" fill="#d3f9d8" stroke="#69db7c"/>
  <text x="632" y="286" class="row" font-weight="bold" fill="#2b8a3e">Gate &gt;= 35% CM: APPROVED</text>

  <!-- BOTTOM PANEL: Traps in Translating Excel to Code -->
  <rect x="24" y="322" width="852" height="132" rx="10" fill="#fdecea" stroke="#e8a79c" stroke-width="1.2"/>
  <text x="40" y="342" class="ph" fill="#b03a2e">Engineering Traps: Why Naive Excel Translations Fail</text>

  <rect x="38" y="352" width="262" height="90" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="50" y="370" class="trap-title">1. Floating-Point Epsilon Drift</text>
  <text x="50" y="388" class="trap-desc">JS (0.1 + 0.2 != 0.3) vs Python Decimal.</text>
  <text x="50" y="402" class="trap-desc">Causes 1-cent quotation mismatches.</text>
  <text x="50" y="424" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Fixed-point arithmetic &amp; shared tests</text>

  <rect x="318" y="352" width="264" height="90" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="330" y="370" class="trap-title">2. Additive vs Gross-up Margin</text>
  <text x="330" y="388" class="trap-desc">Cost &#215; 1.30 (Mark-up: 23% margin) !=</text>
  <text x="330" y="402" class="trap-desc">Cost / (1 - 0.30) (True 30% margin).</text>
  <text x="330" y="424" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Explicit gross-up division formula</text>

  <rect x="600" y="352" width="264" height="90" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <text x="612" y="370" class="trap-title">3. Unscaled Overhead Compounding</text>
  <text x="612" y="388" class="trap-desc">Applying freight/duty to total labor instead</text>
  <text x="612" y="402" class="trap-desc">of imported material base alone.</text>
  <text x="612" y="424" class="trap-desc" font-weight="bold" fill="#c92a2a">Fix: Strict cost bucket hierarchy</text>
</svg>
