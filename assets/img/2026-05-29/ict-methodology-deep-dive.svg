<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Compare bed-of-nails and flying-probe ICT by fixture investment, test time, volume and design stability. Establish coverage from the actual board and test program.">
  <style>
    text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .title{font-size:23px;font-weight:700;fill:#1f2933}
    .sub{font-size:13.5px;fill:#52606d}
    .ph{font-size:16px;font-weight:700}
    .role{font-size:11.5px;font-style:italic}
    .k{font-size:11px;font-weight:700;letter-spacing:.5px;fill:#7b8794}
    .v{font-size:13px;fill:#1f2933}
    .gate{font-size:13.5px;font-weight:700;fill:#1c7a3f}
    .foot{font-size:13px;fill:#3e4c59}
  </style>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="40" class="title">ICT: Bed-of-Nails vs Flying Probe</text>
  <text x="30" y="64" class="sub">Choose a method from test access, fault coverage, volume, revisions and current supplier cost.</text>

  <!-- Bed-of-Nails -->
  <rect x="24" y="90" width="412" height="232" rx="12" fill="#e7f1fb" stroke="#9ec5f0"/>
  <text x="44" y="120" class="ph" fill="#1c5fa8">Bed-of-Nails</text>
  <text x="44" y="139" class="role" fill="#1c5fa8">Custom fixture &#8212; probes the designed access points</text>
  <text x="44" y="172" class="k">FIXTURE NRE</text><text x="240" y="172" class="v">Request current quote</text>
  <text x="44" y="202" class="k">SPEED</text><text x="240" y="202" class="v">Fast &#8212; seconds/board</text>
  <text x="44" y="232" class="k">BEST FOR</text><text x="240" y="232" class="v">HVLM &#8212; high vol, low mix</text>
  <text x="44" y="262" class="k">BREAK-EVEN</text><text x="240" y="262" class="v">Calculate for this product</text>
  <text x="44" y="298" class="role" fill="#1c5fa8">Fixture changes may follow board revisions.</text>

  <!-- Flying Probe -->
  <rect x="462" y="90" width="412" height="232" rx="12" fill="#fff7e6" stroke="#f0cf8a"/>
  <text x="482" y="120" class="ph" fill="#9e6b00">Flying Probe</text>
  <text x="482" y="139" class="role" fill="#9e6b00">Moving probes &#8212; no custom fixture</text>
  <text x="482" y="172" class="k">FIXTURE NRE</text><text x="678" y="172" class="v">No custom fixture</text>
  <text x="482" y="202" class="k">SPEED</text><text x="678" y="202" class="v">Slow &#8212; minutes/board</text>
  <text x="482" y="232" class="k">BEST FOR</text><text x="678" y="232" class="v">LVHM &#8212; low vol, high mix</text>
  <text x="482" y="262" class="k">PROGRAM COST</text><text x="678" y="262" class="v">Request current quote</text>
  <text x="482" y="298" class="role" fill="#9e6b00">Program effort and time still have a cost.</text>

  <!-- coverage / rule band -->
  <rect x="24" y="338" width="850" height="66" rx="12" fill="#e6f4ea" stroke="#9ed6ad"/>
  <text x="44" y="364" class="gate">Map required faults to accessible checks before choosing a method.</text>
  <text x="44" y="390" class="v">Compare actual fixture, program, cycle-time and revision costs for the expected builds.</text>

  <text x="30" y="436" class="foot">A test detects only the faults its access and program can observe. Record the gaps.</text>
</svg>
