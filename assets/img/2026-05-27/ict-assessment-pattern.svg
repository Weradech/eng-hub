<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="ICT assessment flow from requirements and board access to detectable faults, current cost comparison and scoped recommendation">
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2933}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#52606d}.head{font-size:17px;font-weight:700}.body{font-size:12px;fill:#52606d}.step{font-size:13px;font-weight:700;fill:#1c5fa8}.foot{font-size:14px;font-weight:700;fill:#1c5fa8}</style>
  <rect width="900" height="470" fill="#fff"/>
  <text x="30" y="42" class="title">Choose ICT from the board and faults to detect</text>
  <text x="30" y="68" class="sub">A pad count or checklist score cannot establish product fault coverage.</text>
  <rect x="30" y="108" width="194" height="204" rx="10" fill="#e7f1fb" stroke="#9ec5f0"/>
  <text x="48" y="139" class="step">1 / REQUIREMENTS</text><text x="48" y="171" class="head">Name the faults</text>
  <text x="48" y="207" class="body">Variant and conditions</text><text x="48" y="231" class="body">Acceptance criteria</text><text x="48" y="255" class="body">Customer obligations</text>
  <rect x="245" y="108" width="194" height="204" rx="10" fill="#e7f1fb" stroke="#9ec5f0"/>
  <text x="263" y="139" class="step">2 / ACCESS</text><text x="263" y="171" class="head">Inspect the board</text>
  <text x="263" y="207" class="body">Source and revision</text><text x="263" y="231" class="body">Probe geometry</text><text x="263" y="255" class="body">Fixture obstruction</text>
  <rect x="460" y="108" width="194" height="204" rx="10" fill="#fff4e0" stroke="#f3c677"/>
  <text x="478" y="139" class="step">3 / DETECTION</text><text x="478" y="171" class="head">Map coverage</text>
  <text x="478" y="207" class="body">Program and stimulus</text><text x="478" y="231" class="body">Ambiguous paths</text><text x="478" y="255" class="body">Remaining test gaps</text>
  <rect x="675" y="108" width="194" height="204" rx="10" fill="#e9f7ee" stroke="#a6dcb8"/>
  <text x="693" y="139" class="step">4 / DECISION</text><text x="693" y="171" class="head">Compare options</text>
  <text x="693" y="207" class="body">Current supplier offers</text><text x="693" y="231" class="body">Volume and revisions</text><text x="693" y="255" class="body">ICT / probe / FCT mix</text>
  <rect x="30" y="348" width="838" height="80" rx="10" fill="#f5f7fa" stroke="#cbd2d9"/>
  <text x="48" y="380" class="foot">Report mapped fault coverage and untested requirements separately.</text>
  <text x="48" y="405" class="body">Recommendation is not a passed production test or customer approval.</text>
</svg>
