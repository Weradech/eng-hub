<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Illustrative NPI stages with separate evidence, assessment, recommendation and authorized decision at each handoff">
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2933}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#52606d}.stage{font-size:20px;font-weight:700;fill:#fff}.small{font-size:12px;fill:#52606d}.head{font-size:17px;font-weight:700}.foot{font-size:15px;font-weight:700;fill:#1c5fa8}</style>
  <rect width="900" height="470" fill="#fff"/>
  <text x="30" y="42" class="title">An NPI gate authorizes a named next activity</text>
  <text x="30" y="68" class="sub">Stage names are examples. Product criteria, schedule and authority come from the actual project.</text>
  <rect x="30" y="110" width="140" height="72" rx="10" fill="#2b3a4a"/><text x="100" y="154" text-anchor="middle" class="stage">PoC</text>
  <rect x="205" y="110" width="140" height="72" rx="10" fill="#2b3a4a"/><text x="275" y="154" text-anchor="middle" class="stage">EVT</text>
  <rect x="380" y="110" width="140" height="72" rx="10" fill="#2b3a4a"/><text x="450" y="154" text-anchor="middle" class="stage">DVT</text>
  <rect x="555" y="110" width="140" height="72" rx="10" fill="#2b3a4a"/><text x="625" y="154" text-anchor="middle" class="stage">PVT</text>
  <rect x="730" y="110" width="140" height="72" rx="10" fill="#2f7a37"/><text x="800" y="154" text-anchor="middle" class="stage">MP</text>
  <text x="184" y="155" text-anchor="middle" class="head">&#8594;</text><text x="359" y="155" text-anchor="middle" class="head">&#8594;</text><text x="534" y="155" text-anchor="middle" class="head">&#8594;</text><text x="709" y="155" text-anchor="middle" class="head">&#8594;</text>
  <rect x="30" y="218" width="196" height="130" rx="10" fill="#e7f1fb" stroke="#9ec5f0"/>
  <text x="48" y="249" class="head">1. Machine result</text><text x="48" y="278" class="small">Defined check and scope</text><text x="48" y="301" class="small">Source and configuration</text>
  <rect x="244" y="218" width="196" height="130" rx="10" fill="#e7f1fb" stroke="#9ec5f0"/>
  <text x="262" y="249" class="head">2. Assessment</text><text x="262" y="278" class="small">Requirements and gaps</text><text x="262" y="301" class="small">Engineering interpretation</text>
  <rect x="458" y="218" width="196" height="130" rx="10" fill="#fff4e0" stroke="#f3c677"/>
  <text x="476" y="249" class="head">3. Recommendation</text><text x="476" y="278" class="small">HOLD / conditional / GO</text><text x="476" y="301" class="small">Named scope and restriction</text>
  <rect x="672" y="218" width="196" height="130" rx="10" fill="#e9f7ee" stroke="#a6dcb8"/>
  <text x="690" y="249" class="head">4. Decision</text><text x="690" y="278" class="small">Actual authority and date</text><text x="690" y="301" class="small">Evidence and conditions</text>
  <rect x="30" y="380" width="838" height="54" rx="10" fill="#f5f7fa" stroke="#cbd2d9"/>
  <text x="48" y="413" class="foot">A passed check does not grant production or shipment authorization.</text>
</svg>
