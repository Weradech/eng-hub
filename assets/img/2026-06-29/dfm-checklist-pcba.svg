<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="DFM review sequence: identify the build, inspect the planned manufacturing route, and record findings with actual analysis evidence">
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2933}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#52606d}.head{font-size:18px;font-weight:700}.body{font-size:13px;fill:#52606d}.step{font-size:13px;font-weight:700;fill:#1c5fa8}.foot{font-size:14px;font-weight:700;fill:#1c5fa8}</style>
  <rect width="900" height="470" fill="#fff"/>
  <text x="30" y="42" class="title">DFM review follows the actual build route</text>
  <text x="30" y="68" class="sub">Use this diagram to plan a review. It is not an inspection image or a supplier capability statement.</text>
  <rect x="28" y="104" width="264" height="222" rx="12" fill="#e7f1fb" stroke="#9ec5f0"/>
  <text x="48" y="136" class="step">1 / BASELINE</text>
  <text x="48" y="170" class="head">Identify the build</text>
  <text x="48" y="204" class="body">Product, variant, board revision</text>
  <text x="48" y="228" class="body">BOM, placement and drawings</text>
  <text x="48" y="252" class="body">Supplier and intended process</text>
  <text x="48" y="296" class="body">Missing source = NOT REVIEWED</text>
  <rect x="318" y="104" width="264" height="222" rx="12" fill="#fff4e0" stroke="#f3c677"/>
  <text x="338" y="136" class="step">2 / PROCESS</text>
  <text x="338" y="170" class="head">Inspect each operation</text>
  <text x="338" y="204" class="body">PCB fabrication and stack-up</text>
  <text x="338" y="228" class="body">Placement, paste and soldering</text>
  <text x="338" y="252" class="body">Inspection, test and handling</text>
  <text x="338" y="296" class="body">Use confirmed process limits</text>
  <rect x="608" y="104" width="264" height="222" rx="12" fill="#e9f7ee" stroke="#a6dcb8"/>
  <text x="628" y="136" class="step">3 / EVIDENCE</text>
  <text x="628" y="170" class="head">Resolve each concern</text>
  <text x="628" y="204" class="body">Source, location and measurement</text>
  <text x="628" y="228" class="body">Image from actual analysis</text>
  <text x="628" y="252" class="body">Owner and supplier response</text>
  <text x="628" y="296" class="body">Recheck the revised file</text>
  <rect x="28" y="354" width="844" height="70" rx="10" fill="#f5f7fa" stroke="#cbd2d9"/>
  <text x="48" y="382" class="foot">A finding needs source evidence; a release needs its own scoped decision.</text>
  <text x="48" y="405" class="body">An unresolved requirement or unconfirmed capability remains open.</text>
</svg>
